# =============================================================================
# TMUX CONFIGURATION
# Aerospace/i3-like workflow with Ctrl+Space as prefix
# =============================================================================

# -----------------------------------------------------------------------------
# Core settings
# -----------------------------------------------------------------------------
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1              # Start windows at 1 (like i3 workspaces)
setw -g pane-base-index 1        # Start panes at 1
set -g renumber-windows on       # Renumber windows when one is closed
set -g escape-time 0             # No delay for escape key (important for Neovim)
set -g history-limit 10000
set -g focus-events on

# -----------------------------------------------------------------------------
# Prefix: Ctrl+Space
# -----------------------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# -----------------------------------------------------------------------------
# Reload config
# -----------------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# -----------------------------------------------------------------------------
# Window (tab) switching — prefix then 1-9
# -----------------------------------------------------------------------------
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# -----------------------------------------------------------------------------
# Move pane to window — prefix then Shift+1-9
# -----------------------------------------------------------------------------
bind ! join-pane -t :1
bind @ join-pane -t :2
bind '#' join-pane -t :3
bind '$' join-pane -t :4
bind '%' join-pane -t :5
bind '^' join-pane -t :6
bind '&' join-pane -t :7
bind '*' join-pane -t :8
bind '(' join-pane -t :9

# -----------------------------------------------------------------------------
# Pane focus — prefix then hjkl
# -----------------------------------------------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# -----------------------------------------------------------------------------
# Swap pane — prefix then Shift+hjkl
# -----------------------------------------------------------------------------
bind H swap-pane -s '{left-of}'
bind J swap-pane -s '{down-of}'
bind K swap-pane -s '{up-of}'
bind L swap-pane -s '{right-of}'

# -----------------------------------------------------------------------------
# Resize panes — prefix then Ctrl+hjkl (hold to keep resizing)
# -----------------------------------------------------------------------------
bind -r C-h resize-pane -L 3
bind -r C-j resize-pane -D 3
bind -r C-k resize-pane -U 3
bind -r C-l resize-pane -R 3

# -----------------------------------------------------------------------------
# Splits — prefix then | for vertical, - for horizontal
# (intuitive: | looks like a vertical split, - looks like a horizontal split)
# -----------------------------------------------------------------------------
unbind '"'
unbind %
bind b split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

# -----------------------------------------------------------------------------
# New window — prefix then n (opens in current path)
# -----------------------------------------------------------------------------
bind n new-window -c "#{pane_current_path}"

# -----------------------------------------------------------------------------
# Rename window — prefix then comma (like i3's rename workspace)
# -----------------------------------------------------------------------------
bind , command-prompt -I "#W" "rename-window '%%'"

# -----------------------------------------------------------------------------
# Close pane/window — prefix then q
# -----------------------------------------------------------------------------
bind q kill-pane

# -----------------------------------------------------------------------------
# Toggle zoom (fullscreen pane) — prefix then f
# -----------------------------------------------------------------------------
bind f resize-pane -Z

# -----------------------------------------------------------------------------
# Status bar — Catppuccin Mocha palette, clean and minimal
# -----------------------------------------------------------------------------
set -g status on
set -g status-position bottom
set -g status-interval 2
set -g status-justify left

# Colors (Catppuccin Mocha)
color_bg="#1e1e2e"
color_surface="#313244"
color_overlay="#6c7086"
color_text="#cdd6f4"
color_blue="#89b4fa"
color_mauve="#cba6f7"
color_green="#a6e3a1"
color_red="#f38ba8"

set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left: session name
set -g status-left-length 30
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa]"

# Right: date and time
set -g status-right-length 60
set -g status-right "#[fg=#6c7086] %a %d %b #[fg=#cdd6f4,bold] %H:%M "

# Window tabs
set -g window-status-format "#[fg=#6c7086,bg=#1e1e2e]  #I #W  "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold]  #I #W  "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Message/command prompt
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
