# =============================================================================
# TMUX CONFIGURATION
# Aerospace/i3-like workflow with Ctrl+Space as prefix
# =============================================================================

# -----------------------------------------------------------------------------
# Core settings
# -----------------------------------------------------------------------------
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1              # Start windows at 1 (like i3 workspaces)
setw -g pane-base-index 1        # Start panes at 1
set -g renumber-windows on       # Renumber windows when one is closed
set -g escape-time 0             # No delay for escape key (important for Neovim)
set -g history-limit 10000
set -g focus-events on

# -----------------------------------------------------------------------------
# Prefix: Ctrl+Space
# -----------------------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# -----------------------------------------------------------------------------
# Reload config
# -----------------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# -----------------------------------------------------------------------------
# Window (tab) switching — prefix then 1-9
# -----------------------------------------------------------------------------
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# -----------------------------------------------------------------------------
# Move pane to window — prefix then Shift+1-9
# -----------------------------------------------------------------------------
bind ! join-pane -t :1
bind @ join-pane -t :2
bind '#' join-pane -t :3
bind '$' join-pane -t :4
bind '%' join-pane -t :5
bind '^' join-pane -t :6
bind '&' join-pane -t :7
bind '*' join-pane -t :8
bind '(' join-pane -t :9

# -----------------------------------------------------------------------------
# Pane focus — prefix then hjkl
# -----------------------------------------------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# -----------------------------------------------------------------------------
# Swap pane — prefix then Shift+hjkl
# -----------------------------------------------------------------------------
bind H swap-pane -s '{left-of}'
bind J swap-pane -s '{down-of}'
bind K swap-pane -s '{up-of}'
bind L swap-pane -s '{right-of}'

# -----------------------------------------------------------------------------
# Resize panes — prefix then Ctrl+hjkl (hold to keep resizing)
# -----------------------------------------------------------------------------
bind -r C-h resize-pane -L 3
bind -r C-j resize-pane -D 3
bind -r C-k resize-pane -U 3
bind -r C-l resize-pane -R 3

# -----------------------------------------------------------------------------
# Splits — prefix then | for vertical, - for horizontal
# (intuitive: | looks like a vertical split, - looks like a horizontal split)
# -----------------------------------------------------------------------------
unbind '"'
unbind %
bind b split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

# -----------------------------------------------------------------------------
# New window — prefix then n (opens in current path)
# -----------------------------------------------------------------------------
bind n new-window -c "#{pane_current_path}"

# -----------------------------------------------------------------------------
# Rename window — prefix then comma (like i3's rename workspace)
# -----------------------------------------------------------------------------
bind , command-prompt -I "#W" "rename-window '%%'"

# -----------------------------------------------------------------------------
# Close pane/window — prefix then q
# -----------------------------------------------------------------------------
bind q kill-pane

# -----------------------------------------------------------------------------
# Toggle zoom (fullscreen pane) — prefix then f
# -----------------------------------------------------------------------------
bind f resize-pane -Z

# -----------------------------------------------------------------------------
# Status bar — Monochrome gray/black palette, clean and minimal
# -----------------------------------------------------------------------------
set -g status on
set -g status-position bottom
set -g status-interval 2
set -g status-justify left

# Colors (Monochrome grayscale)
color_bg="#000000"
color_surface="#1a1a1a"
color_overlay="#4d4d4d"
color_text="#d0d0d0"
color_light_gray="#b3b3b3"
color_white="#f2f2f2"
color_dim="#808080"

set -g status-style "bg=#000000,fg=#d0d0d0"

# Left: (session name removed — status-left left empty)
set -g status-left ""
set -g status-left-length 0

# Right: date and time (unchanged format/position)
set -g status-right-length 60
set -g status-right "#[fg=#808080] %a %d %b #[fg=#d0d0d0,bold] %H:%M "

# Window tabs — numbers only, no window names
set -g window-status-format "#[fg=#808080,bg=#000000] #I "
set -g window-status-current-format "#[fg=#f2f2f2,bg=#000000,bold] #I "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#1a1a1a"
set -g pane-active-border-style "fg=#b3b3b3"

# Message/command prompt
set -g message-style "bg=#1a1a1a,fg=#d0d0d0"
set -g message-command-style "bg=#1a1a1a,fg=#d0d0d0"
